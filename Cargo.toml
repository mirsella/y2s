[package]
name = "y2s"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
cookie-scoop = { path = "../cookie-scoop/crates/cookie-scoop" }
dialoguer = "0.11"
hmac = "0.12"
html-escape = "0.2"
indicatif = "0.17"
once_cell = "1.21"
opencode_rs = { version = "0.7", features = ["server"] }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "charset", "cookies", "deflate", "gzip", "json", "rustls-tls"] }
serde_json = "1"
sha1 = "0.10"
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
